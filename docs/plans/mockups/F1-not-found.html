<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크를 찾을 수 없습니다 — ShortLink</title>
<style>
/* ===== 공통 스타일: src/shortlink/static/style.css 의 기준 (네 목업 모두 같은 블록) ===== */
:root {
  --color-bg: #f3f4f6;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-muted: #6b7280;
  --color-border: #d1d5db;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-error: #b91c1c;
  --color-error-bg: #fef2f2;
  --color-success: #15803d;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.6;
}
.site-header {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.site-header .inner, main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px;
}
.site-header .inner { padding-top: 14px; padding-bottom: 14px; }
.brand {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-primary);
  text-decoration: none;
}
main { padding-top: 32px; padding-bottom: 48px; }
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
}
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.tagline { margin: 0 0 24px; color: var(--color-muted); }
label { display: block; font-weight: 600; margin-bottom: 6px; }
.field-row { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
input[type="text"]:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
input[aria-invalid="true"] { border-color: var(--color-error); }
button, .button {
  padding: 10px 18px;
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
  background: var(--color-primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--color-primary-hover); }
.error {
  margin: 0 0 16px;
  padding: 10px 12px;
  color: var(--color-error);
  background: var(--color-error-bg);
  border: 1px solid var(--color-error);
  border-radius: var(--radius);
}
.result-label { margin: 0 0 6px; font-weight: 600; }
.short-url-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
.short-url {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-bg);
  border-radius: var(--radius);
  overflow-wrap: anywhere;
}
.original-url {
  margin: 0 0 24px;
  color: var(--color-muted);
  overflow-wrap: anywhere;
}
.copy-status { min-height: 1.6em; margin: -12px 0 12px; color: var(--color-success); font-size: 0.9rem; }
.back-link { color: var(--color-primary); font-weight: 600; }
@media (max-width: 480px) {
  .field-row, .short-url-row { flex-direction: column; align-items: stretch; }
  .card { padding: 16px; }
}
/* ===== 공통 스타일 끝 ===== */
</style>
</head>
<body>
<header class="site-header">
  <div class="inner"><a class="brand" href="/">ShortLink</a></div>
</header>
<main>
  <section class="card">
    <h1>링크를 찾을 수 없습니다</h1>
    <p class="tagline">주소가 정확한지 확인해 주세요. 없는 링크이거나 주소를 잘못 입력했을 수 있습니다.</p>
    <a class="back-link" href="/">홈으로 가기</a>
  </section>
</main>
</body>
</html>
