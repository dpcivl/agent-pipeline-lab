<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단축 URL을 만들었습니다 — ShortLink</title>
<style>
/* ===== 공통 스타일: src/shortlink/static/style.css 의 기준 (F1 블록 그대로) ===== */
:root {
  --color-bg: #f3f4f6;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-muted: #6b7280;
  --color-border: #d1d5db;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-error: #b91c1c;
  --color-error-bg: #fef2f2;
  --color-success: #15803d;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.6;
}
.site-header {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.site-header .inner, main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px;
}
.site-header .inner { padding-top: 14px; padding-bottom: 14px; }
.brand {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-primary);
  text-decoration: none;
}
main { padding-top: 32px; padding-bottom: 48px; }
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
}
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.tagline { margin: 0 0 24px; color: var(--color-muted); }
label { display: block; font-weight: 600; margin-bottom: 6px; }
.field-row { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
input[type="text"]:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
input[aria-invalid="true"] { border-color: var(--color-error); }
button, .button {
  padding: 10px 18px;
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
  background: var(--color-primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--color-primary-hover); }
.error {
  margin: 0 0 16px;
  padding: 10px 12px;
  color: var(--color-error);
  background: var(--color-error-bg);
  border: 1px solid var(--color-error);
  border-radius: var(--radius);
}
.result-label { margin: 0 0 6px; font-weight: 600; }
.short-url-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
.short-url {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-bg);
  border-radius: var(--radius);
  overflow-wrap: anywhere;
}
.original-url {
  margin: 0 0 24px;
  color: var(--color-muted);
  overflow-wrap: anywhere;
}
.copy-status { min-height: 1.6em; margin: -12px 0 12px; color: var(--color-success); font-size: 0.9rem; }
.back-link { color: var(--color-primary); font-weight: 600; }
@media (max-width: 480px) {
  .field-row, .short-url-row { flex-direction: column; align-items: stretch; }
  .card { padding: 16px; }
}
/* ===== 공통 스타일 끝 ===== */
/* ===== F2 추가 스타일: src/shortlink/static/style.css 끝에 덧붙인다 (F2 목업 모두 같은 블록) ===== */
.field { margin-bottom: 16px; }
.field input[type="text"] { width: 100%; }
.hint { margin: 6px 0 0; color: var(--color-muted); font-size: 0.875rem; }
.form-actions { margin-top: 4px; }
.link-row { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.stats-link { color: var(--color-primary); font-weight: 600; }
.click-count {
  margin: 0 0 20px;
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1.2;
  color: var(--color-primary);
}
.click-count .unit { margin-left: 4px; font-size: 1.125rem; color: var(--color-muted); }
.stat-list {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 8px 16px;
  margin: 0 0 24px;
}
.stat-list dt { font-weight: 600; }
.stat-list dd { margin: 0; overflow-wrap: anywhere; }
.stat-list .empty { color: var(--color-muted); }
@media (max-width: 480px) {
  .stat-list { grid-template-columns: 1fr; gap: 2px; }
  .stat-list dd { margin-bottom: 8px; }
  .form-actions button { width: 100%; }
}
/* ===== F2 추가 스타일 끝 ===== */
</style>
</head>
<body>
<header class="site-header">
  <div class="inner"><a class="brand" href="/">ShortLink</a></div>
</header>
<main>
  <section class="card">
    <h1>단축 URL을 만들었습니다</h1>
    <p class="tagline">아래 링크를 복사해서 공유하세요.</p>
    <p class="result-label">단축 URL</p>
    <div class="short-url-row">
      <a class="short-url" id="short-url" href="http://localhost:8000/spring-sale">http://localhost:8000/spring-sale</a>
      <button type="button" class="copy-button" data-copy="http://localhost:8000/spring-sale">복사</button>
    </div>
    <p class="copy-status" id="copy-status" aria-live="polite"></p>
    <p class="result-label">원래 URL</p>
    <p class="original-url">https://example.com/blog/2026/10/how-to-share-links?utm_source=newsletter&amp;utm_medium=email</p>
    <div class="link-row">
      <a class="stats-link" href="/stats/spring-sale">통계 보기</a>
      <a class="back-link" href="/">다른 URL 줄이기</a>
    </div>
  </section>
</main>
<script src="/static/copy.js" defer></script>
</body>
</html>
