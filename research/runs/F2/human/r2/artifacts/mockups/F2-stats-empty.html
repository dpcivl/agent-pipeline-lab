<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크 통계 — ShortLink</title>
<style>
/* ===== 공통 스타일: F1과 같음 (src/shortlink/static/style.css) ===== */
:root {
  --color-bg: #f3f4f6;
  --color-surface: #ffffff;
  --color-text: #1f2937;
  --color-muted: #6b7280;
  --color-border: #d1d5db;
  --color-primary: #2563eb;
  --color-primary-hover: #1d4ed8;
  --color-error: #b91c1c;
  --color-error-bg: #fef2f2;
  --color-success: #15803d;
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.6;
}
.site-header {
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.site-header .inner, main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px;
}
.site-header .inner { padding-top: 14px; padding-bottom: 14px; }
.brand {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-primary);
  text-decoration: none;
}
main { padding-top: 32px; padding-bottom: 48px; }
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 24px;
}
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.tagline { margin: 0 0 24px; color: var(--color-muted); }
label { display: block; font-weight: 600; margin-bottom: 6px; }
.field-row { display: flex; gap: 8px; }
input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1rem;
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
}
input[type="text"]:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; }
input[aria-invalid="true"] { border-color: var(--color-error); }
button, .button {
  padding: 10px 18px;
  font-size: 1rem;
  font-weight: 600;
  color: #ffffff;
  background: var(--color-primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--color-primary-hover); }
.error {
  margin: 0 0 16px;
  padding: 10px 12px;
  color: var(--color-error);
  background: var(--color-error-bg);
  border: 1px solid var(--color-error);
  border-radius: var(--radius);
}
.result-label { margin: 0 0 6px; font-weight: 600; }
.short-url-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
.short-url {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--color-primary);
  background: var(--color-bg);
  border-radius: var(--radius);
  overflow-wrap: anywhere;
}
.original-url {
  margin: 0 0 24px;
  color: var(--color-muted);
  overflow-wrap: anywhere;
}
.copy-status { min-height: 1.6em; margin: -12px 0 12px; color: var(--color-success); font-size: 0.9rem; }
.back-link { color: var(--color-primary); font-weight: 600; }
@media (max-width: 480px) {
  .field-row, .short-url-row { flex-direction: column; align-items: stretch; }
  .card { padding: 16px; }
}
/* ===== 공통 스타일 끝 ===== */
/* ===== F2 추가 스타일: src/shortlink/static/style.css 끝에 그대로 덧붙인다 (모든 F2 목업에 같은 블록) ===== */
.field { margin-bottom: 16px; }
.field input[type="text"] { width: 100%; }
.hint { margin: 6px 0 0; color: var(--color-muted); font-size: 0.9rem; }
.form-actions { display: flex; }
.result-actions { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.stats-link { color: var(--color-primary); font-weight: 600; }
.click-count {
  margin: 0 0 20px;
  padding: 16px;
  background: var(--color-bg);
  border-radius: var(--radius);
}
.click-count-label { display: block; font-weight: 600; color: var(--color-muted); }
.click-count-value { display: block; font-size: 2.25rem; font-weight: 700; line-height: 1.2; }
.stats-list { margin: 0 0 24px; }
.stats-list dt { font-weight: 600; }
.stats-list dd { margin: 0 0 12px; overflow-wrap: anywhere; }
.muted { color: var(--color-muted); }
@media (max-width: 480px) {
  .form-actions button { width: 100%; }
}
/* ===== F2 추가 스타일 끝 ===== */
</style>
</head>
<body>
<!-- GET /stats/aB3xY9z, 200. 한 번도 접근하지 않은 링크. -->
<header class="site-header">
  <div class="inner"><a class="brand" href="/">ShortLink</a></div>
</header>
<main>
  <section class="card">
    <h1>링크 통계</h1>
    <p class="tagline">이 단축 링크가 얼마나 쓰였는지 보여 드립니다.</p>
    <p class="result-label">단축 URL</p>
    <div class="short-url-row">
      <a class="short-url" href="http://localhost:8000/aB3xY9z">http://localhost:8000/aB3xY9z</a>
    </div>
    <p class="click-count">
      <span class="click-count-label">클릭 수</span>
      <span class="click-count-value">0</span>
    </p>
    <dl class="stats-list">
      <dt>원래 URL</dt>
      <dd class="original-url">https://example.com/events/2026/fall-sale?utm_source=newsletter&amp;utm_medium=email</dd>
      <dt>만든 시각</dt>
      <dd><time datetime="2026-10-29T01:23:45Z">2026-10-29 01:23:45 UTC</time></dd>
      <dt>마지막 접근</dt>
      <dd class="muted">아직 없음</dd>
    </dl>
    <a class="back-link" href="/">홈으로 가기</a>
  </section>
</main>
</body>
</html>
